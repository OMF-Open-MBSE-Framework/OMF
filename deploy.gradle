import groovy.xml.XmlUtil

/----------------- PACKAGING & DEPLOY SECTION ---------------------------/
String srcZipName           = "SRC" + findProperty('pluginName') + "_" + findProperty('version') + ".zip"

/**
 * Zip the plugin
 */
task zipDir(type: Zip) {
    archiveFileName = pluginName  + "_" + findProperty  ('version')  + ".zip"
    pluginTargetUrlectory = file(pluginTargetUrl)
    from "$buildDir/generated-dist"
    exclude "**/com.samares.samarescore.test/**"
}

/**
 * Parse the descriptor.xml to fill in with plugin info are on it.
 */
task parseXml () {
    def resourceWebDescriptors= (new XmlParser()).parse(serverDescriptorPath)
    def pluginDescriptor = (new XmlParser()).parse("build/generated-dist/data/resourcemanager/" + descriptorFile)

    //Remove descriptor with same Id if any
    def resourceWebDescriptorSameID = resourceWebDescriptors.resourceWebDescriptor.find{it.resourceDescriptor.'@id'.text() == pluginId}
    if (resourceWebDescriptorSameID){
        resourceWebDescriptors.remove(resourceWebDescriptorSameID)
    }

    def newResourceWebDescriptorNode = new Node(null, "resourceWebDescriptor", [])
    newResourceWebDescriptorNode.children().add(0, pluginDescriptor)
    resourceWebDescriptors.children().add(0, newResourceWebDescriptorNode)

    new File(serverDescriptorPath).write(XmlUtil.serialize(resourceWebDescriptors))
}

/----------------- PACKAGING & DEPLOY SECTION ---------------------------/


/**
 * Zip the plugin
 */
task srcZipDir(type: Zip) {
    archiveFileName = srcZipName
    pluginTargetUrlectory = file(srcDeliverPath)
    from "src/main/java"
    from "dist"

}
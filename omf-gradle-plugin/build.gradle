apply plugin: 'groovy'
apply plugin: 'java-gradle-plugin'
apply plugin: 'maven-publish'

group 'com.samares-engineering.omf.omf-gradle-plugin'
version '0.115.7-SNAPSHOT'
ext.isRelease = !version.endsWith("-SNAPSHOT")

dependencies {
    testImplementation 'org.spockframework:spock-core:2.1-groovy-3.0'
}

gradlePlugin {
    plugins {
        omfGradlePlugin {
            id = group
            implementationClass = 'com.samares_engineering.omf.omf_gradle_plugin.OmfGradlePlugin'
        }
    }
}

publishing {
    repositories {
        maven {
            allowInsecureProtocol true
            credentials {
                username nexusUsername
                password nexusPassword
            }
            def releasesRepoUrl = "$nexusUrl/maven-releases"
            def snapshotsRepoUrl = "$nexusUrl/maven-snapshots"
            url = isRelease ? releasesRepoUrl : snapshotsRepoUrl
        }
    }
}

repositories {
    mavenCentral()
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(11))
    }

}